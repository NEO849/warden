<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 320" role="img"
     aria-label="Warden — compounding, governed memory for the data graph. It remembers what feeds your models.">
  <defs>
    <linearGradient id="wg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#14b8a6"/>
      <stop offset="1" stop-color="#0f766e"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="320" fill="#ffffff"/>
  <line x1="80" y1="252" x2="1200" y2="252" stroke="#e5e7eb" stroke-width="2"/>

  <!-- mark: a warden's shield guarding a lineage spine (the reverse-lineage motif) -->
  <g transform="translate(96,80) scale(2.05)">
    <path d="M32 4 55 12 V32 C55 46 45 55 32 60 C19 55 9 46 9 32 V12 Z"
          fill="none" stroke="url(#wg)" stroke-width="3.4" stroke-linejoin="round"/>
    <line x1="21" y1="21" x2="43" y2="43" stroke="url(#wg)" stroke-width="3" stroke-linecap="round"/>
    <circle cx="21" cy="21" r="4.2" fill="#ffffff" stroke="url(#wg)" stroke-width="3"/>
    <circle cx="32" cy="32" r="4.2" fill="#ffffff" stroke="url(#wg)" stroke-width="3"/>
    <circle cx="43" cy="43" r="4.8" fill="#dc2626" stroke="#dc2626" stroke-width="3"/>
  </g>

  <!-- wordmark -->
  <text x="300" y="164" font-family="'Segoe UI',system-ui,-apple-system,sans-serif"
        font-size="76" font-weight="700" fill="#0b0f14">Warden</text>
  <!-- tagline -->
  <text x="303" y="210" font-family="'Segoe UI',system-ui,-apple-system,sans-serif"
        font-size="29" fill="#6b7280">It remembers what feeds your models.</text>

  <!-- signature: the money shot — a silently-drifted model flipped before the retrain -->
  <text x="1180" y="150" text-anchor="end"
        font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="33" font-weight="700">
    <tspan fill="#0d9488">TRUSTED</tspan><tspan fill="#9ca3af" dx="8">&#8594;</tspan><tspan fill="#dc2626" dx="8">NEEDS_REVIEW</tspan>
  </text>
  <text x="1180" y="184" text-anchor="end"
        font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="18"
        fill="#6b7280" letter-spacing="1">caught before the retrain</text>
</svg>
