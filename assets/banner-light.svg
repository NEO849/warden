<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 320" role="img"
     aria-label="Warden — compounding, governed memory for the data graph. It remembers what feeds your models. A trusted model flips to NEEDS_REVIEW, caught before the retrain.">
  <defs>
    <linearGradient id="wg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#14b8a6"/>
      <stop offset="1" stop-color="#0f766e"/>
    </linearGradient>
    <radialGradient id="bloom" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#14b8a6" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#14b8a6" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softglow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- canvas -->
  <rect width="1280" height="320" fill="#ffffff"/>
  <!-- teal bloom behind the emblem, for depth -->
  <ellipse cx="150" cy="150" rx="360" ry="240" fill="url(#bloom)"/>

  <!-- ============ emblem: warden's shield guarding a lineage spine ============ -->
  <g transform="translate(84,72) scale(2.2)">
    <path d="M32 4 55 12 V32 C55 46 45 55 32 60 C19 55 9 46 9 32 V12 Z"
          fill="url(#wg)" fill-opacity="0.08"/>
    <path d="M32 4 55 12 V32 C55 46 45 55 32 60 C19 55 9 46 9 32 V12 Z"
          fill="none" stroke="url(#wg)" stroke-width="3.2" stroke-linejoin="round"/>
    <line x1="21" y1="21" x2="43" y2="43" stroke="url(#wg)" stroke-width="3" stroke-linecap="round"/>
    <circle cx="21" cy="21" r="4.2" fill="#ffffff" stroke="url(#wg)" stroke-width="3"/>
    <circle cx="32" cy="32" r="4.2" fill="#ffffff" stroke="url(#wg)" stroke-width="3"/>
    <circle cx="43" cy="43" r="5" fill="none" stroke="#DC2626" stroke-width="1.6" opacity="0">
      <animate attributeName="r" values="5;12" dur="2.6s" repeatCount="indefinite" calcMode="spline" keyTimes="0;1" keySplines="0.3 0 0.7 1"/>
      <animate attributeName="opacity" values="0.5;0" dur="2.6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="43" cy="43" r="4.8" fill="#DC2626" filter="url(#glow)">
      <animate attributeName="r" values="4.8;6.1;4.8" dur="2.6s" repeatCount="indefinite" calcMode="spline" keyTimes="0;0.5;1" keySplines="0.4 0 0.6 1;0.4 0 0.6 1"/>
    </circle>
  </g>

  <!-- ============ wordmark block ============ -->
  <text x="302" y="116" font-family="'Segoe UI',system-ui,-apple-system,sans-serif"
        font-size="15" font-weight="600" letter-spacing="2.5" fill="#0d9488">GOVERNED MEMORY&#160;&#160;&#183;&#160;&#160;DATAHUB GRAPH</text>

  <text x="300" y="180" font-family="'Segoe UI',system-ui,-apple-system,sans-serif"
        font-size="78" font-weight="700" letter-spacing="0.5" fill="#0b0f14">Warden</text>
  <rect x="303" y="196" width="134" height="3" rx="1.5" fill="url(#wg)"/>

  <text x="303" y="230" font-family="'Segoe UI',system-ui,-apple-system,sans-serif"
        font-size="27" fill="#6b7280">It remembers what feeds your models.</text>

  <!-- ============ verdict chip ============ -->
  <g>
    <rect x="812" y="104" width="410" height="96" rx="14" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>
    <text x="1200" y="134" text-anchor="end"
          font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="14"
          fill="#6b7280" letter-spacing="1">scienceModel</text>
    <circle cx="835" cy="160" r="4" fill="#DC2626" filter="url(#glow)"/>
    <text x="1200" y="168" text-anchor="end"
          font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="26" font-weight="700">
      <tspan fill="#0d9488">TRUSTED</tspan><tspan fill="#9ca3af" dx="10">&#8594;</tspan><tspan fill="#DC2626" dx="10" filter="url(#softglow)">NEEDS_REVIEW</tspan>
    </text>
    <text x="1200" y="190" text-anchor="end"
          font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="13"
          fill="#6b7280" letter-spacing="1.5">caught before the retrain</text>
  </g>

  <!-- ============ divider ============ -->
  <line x1="300" y1="252" x2="1222" y2="252" stroke="#e5e7eb" stroke-width="1.5"/>

  <!-- ============ bottom lineage-flow band ============ -->
  <g opacity="0.75">
    <path d="M320 290 H1120" fill="none" stroke="#e5e7eb" stroke-width="2"/>
    <path d="M320 290 H1120" fill="none" stroke="url(#wg)" stroke-width="2" stroke-dasharray="7 13" stroke-linecap="round">
      <animate attributeName="stroke-dashoffset" from="0" to="-200" dur="5.5s" repeatCount="indefinite"/>
    </path>
    <circle cx="320"  cy="290" r="5" fill="#ffffff" stroke="url(#wg)" stroke-width="2.4"/>
    <circle cx="520"  cy="290" r="5" fill="#ffffff" stroke="url(#wg)" stroke-width="2.4"/>
    <circle cx="740"  cy="290" r="5" fill="#ffffff" stroke="url(#wg)" stroke-width="2.4"/>
    <circle cx="940"  cy="290" r="5" fill="#ffffff" stroke="url(#wg)" stroke-width="2.4"/>
    <circle cx="1120" cy="290" r="7" fill="none" stroke="#DC2626" stroke-width="1.6" opacity="0">
      <animate attributeName="r" values="7;16" dur="2.6s" repeatCount="indefinite" calcMode="spline" keyTimes="0;1" keySplines="0.3 0 0.7 1"/>
      <animate attributeName="opacity" values="0.5;0" dur="2.6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1120" cy="290" r="6" fill="#DC2626" filter="url(#glow)">
      <animate attributeName="r" values="6;7.4;6" dur="2.6s" repeatCount="indefinite" calcMode="spline" keyTimes="0;0.5;1" keySplines="0.4 0 0.6 1;0.4 0 0.6 1"/>
    </circle>
  </g>
</svg>
