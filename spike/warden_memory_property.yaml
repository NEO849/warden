# Warden memory as DataHub Structured Properties (no GMS rebuild).
# Apply with:  datahub properties upsert -f warden_memory_property.yaml
# VERIFY field names/format against audit_source.md on day 1 — DataHub tightens this schema over releases.

- id: warden_summary
  qualified_name: warden.summary
  display_name: "Warden: Memory Summary"
  type: string
  cardinality: SINGLE
  entity_types:
    - dataset
  description: "Agent's current memory of what this asset is (natural language)."

- id: warden_confidence
  qualified_name: warden.confidence
  display_name: "Warden: Confidence"
  type: number
  cardinality: SINGLE
  entity_types:
    - dataset
  description: "Confidence in [0,1] from the Bayesian evidence model."

- id: warden_provenance
  qualified_name: warden.provenance
  display_name: "Warden: Provenance Chain"
  type: string
  cardinality: MULTIPLE
  entity_types:
    - dataset
  description: "Ordered evidence events that grounded/updated this memory (JSON strings)."

- id: warden_agent_version
  qualified_name: warden.agentVersion
  display_name: "Warden: Agent Version"
  type: string
  cardinality: SINGLE
  entity_types:
    - dataset
  description: "Which Warden version wrote this memory (reproducibility)."

- id: warden_last_event
  qualified_name: warden.lastEvent
  display_name: "Warden: Last Revisit Event"
  type: string
  cardinality: SINGLE
  entity_types:
    - dataset
  description: "The metadata event that last caused a re-visit/re-score."
