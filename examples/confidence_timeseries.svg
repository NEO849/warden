<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 500" font-family="sans-serif"><rect width="820" height="500" fill="#1b1f27" rx="8"/><text x="74" y="26" font-size="17" font-weight="bold" fill="#e6e6e6">Warden confidence timeseries — the silent drop, live from the graph</text><text x="74" y="46" font-size="12" fill="#8a93a2">Belief.provenance (c_after per update), read back via WardenMemory.load — not simulated.</text><text x="74" y="62" font-size="12" fill="#8a93a2">All three arcs share the same start; they fork at the last event, where a measured PSI term is (or isn't) folded in.</text><circle cx="78" cy="80" r="5" fill="#9aa4b2"/><text x="90" y="84" font-size="12" fill="#e6e6e6">shared baseline → hero stops here (no PSI profile in that demo)</text><circle cx="78" cy="96" r="5" fill="#d9a441"/><text x="90" y="100" font-size="12" fill="#e6e6e6">kill-shot: PSI stays silent (&lt; 0.10) → flat</text><circle cx="78" cy="112" r="5" fill="#e06c75"/><text x="90" y="116" font-size="12" fill="#e6e6e6">measured: real PSI=1.32 (&gt; 0.25) → drops harder</text><line x1="74" y1="410.0" x2="780" y2="410.0" stroke="#2c313c" stroke-width="1"/><text x="64" y="414.0" text-anchor="end" font-size="11" fill="#8a93a2">0.00</text><line x1="74" y1="340.5" x2="780" y2="340.5" stroke="#2c313c" stroke-width="1"/><text x="64" y="344.5" text-anchor="end" font-size="11" fill="#8a93a2">0.25</text><line x1="74" y1="271.0" x2="780" y2="271.0" stroke="#2c313c" stroke-width="1"/><text x="64" y="275.0" text-anchor="end" font-size="11" fill="#8a93a2">0.50</text><line x1="74" y1="201.5" x2="780" y2="201.5" stroke="#2c313c" stroke-width="1"/><text x="64" y="205.5" text-anchor="end" font-size="11" fill="#8a93a2">0.75</text><line x1="74" y1="132.0" x2="780" y2="132.0" stroke="#2c313c" stroke-width="1"/><text x="64" y="136.0" text-anchor="end" font-size="11" fill="#8a93a2">1.00</text><line x1="74" y1="215.4" x2="780" y2="215.4" stroke="#e06c75" stroke-width="1.5" stroke-dasharray="6,4"/><text x="780" y="207.4" text-anchor="end" font-size="11" fill="#e06c75">governance τ=0.70 → opens a Proposal below this line</text><text x="74.0" y="432.0" text-anchor="middle" font-size="10" fill="#8a93a2">corrob. lineage</text><text x="74.0" y="445.0" text-anchor="middle" font-size="10" fill="#8a93a2">(indirect, hops=2)</text><text x="309.3" y="432.0" text-anchor="middle" font-size="10" fill="#8a93a2">corrob. lineage</text><text x="309.3" y="445.0" text-anchor="middle" font-size="10" fill="#8a93a2">(direct → 0.901)</text><text x="544.7" y="432.0" text-anchor="middle" font-size="10" fill="#8a93a2">− structural Δ</text><text x="544.7" y="445.0" text-anchor="middle" font-size="10" fill="#8a93a2">(source re-point)</text><text x="780.0" y="432.0" text-anchor="middle" font-size="10" fill="#8a93a2">− drift_stat Δ</text><text x="780.0" y="445.0" text-anchor="middle" font-size="10" fill="#8a93a2">(measured PSI)</text><polyline points="74.0,243.2 309.3,159.5 544.7,243.2" fill="none" stroke="#9aa4b2" stroke-width="3"/><circle cx="74.0" cy="243.2" r="5" fill="#9aa4b2"/><text x="74.0" y="232.2" text-anchor="middle" font-size="12" font-weight="bold" fill="#e6e6e6">0.600</text><circle cx="309.3" cy="159.5" r="5" fill="#9aa4b2"/><text x="309.3" y="148.5" text-anchor="middle" font-size="12" font-weight="bold" fill="#e6e6e6">0.901</text><circle cx="544.7" cy="243.2" r="5" fill="#9aa4b2"/><text x="544.7" y="232.2" text-anchor="middle" font-size="12" font-weight="bold" fill="#e6e6e6">0.600</text><polyline points="544.7,243.2 780.0,243.2" fill="none" stroke="#d9a441" stroke-width="3"/><circle cx="780.0" cy="243.2" r="5" fill="#d9a441"/><text x="780.0" y="232.2" text-anchor="middle" font-size="12" font-weight="bold" fill="#e6e6e6">0.600</text><polyline points="544.7,243.2 780.0,340.2" fill="none" stroke="#e06c75" stroke-width="3"/><circle cx="780.0" cy="340.2" r="5" fill="#e06c75"/><text x="780.0" y="329.2" text-anchor="middle" font-size="12" font-weight="bold" fill="#e6e6e6">0.251</text><circle c